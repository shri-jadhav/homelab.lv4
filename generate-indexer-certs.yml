# Wazuh Single-Node Certificate Generator
# Derived from official wazuh-docker repository (v4.14.9)
services:
  generator:
    image: wazuh/wazuh-certs-generator:${CERT_TOOL_VERSION:-0.0.4}
    hostname: wazuh-certs-generator
    environment:
      - CERT_TOOL_VERSION=4.14
    volumes:
      - ./config/wazuh_indexer_ssl_certs/:/certificates/
      - ./config/certs.yml:/config/certs.yml
