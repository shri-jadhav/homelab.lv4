name: SOC Detection Lab CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit & Evaluation Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify Python syntax and bytecode compilation
        run: python -m compileall src tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src

      - name: Run detection evaluation benchmark suite
        run: python -m detectlab.cli --eval --out artifacts
        env:
          PYTHONPATH: src

      - name: Validate Docker Compose configuration with .env.example
        run: docker compose --env-file .env.example config -q
